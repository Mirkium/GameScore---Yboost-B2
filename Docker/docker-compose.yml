services:
  mysql:
    image: mysql:8.0
    container_name: gamescore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: gamescore
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - mysqld
      - "--default-authentication-plugin=caching_sha2_password"
      - "--sql-mode="
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.backend
    container_name: gamescore-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: pass
      DB_NAME: gamescore
      PORT: "3000"
      RAWG_API_KEY: ${RAWG_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      TYPEORM_SYNCHRONIZE: "false"
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.frontend
    container_name: gamescore-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:

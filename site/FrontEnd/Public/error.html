<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>GameScore - error</title>
    <meta name="description" content="Page d'erreur GameScore">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./assets/css/home.main.css">
</head>

<body>
    <header class="header">
        <a href="./home.html" class="logo">GameScore</a>

        <form class="search-bar" role="search">
            <input type="search" class="search-input" placeholder="Search games..." aria-label="Rechercher un jeu">
            <button class="search-btn" aria-label="Lancer la recherche">GO</button>
        </form>
        <nav class="auth-nav" aria-label="Navigation utilisateur">
            <a href="./home.html" class="link signup">Home</a>
            <a href="./connect.html" class="btn login">Login</a>
        </nav>
    </header>

    <main class="errorPage">
        <section class="errorBox">
            <p class="errorCode">404</p>
            <h1 class="pageTitle">Game not found</h1>
            <p class="pageText">This page is missing from the library. Try going back home or searching another game.</p>
            <a href="./home.html" class="neonBtn pinkBtn">Back Home</a>
        </section>
    </main>
    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/app-ui.js"></script>
</body>

</html>

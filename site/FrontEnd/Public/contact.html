<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>GameScore - contact</title>
    <meta name="description" content="Contactez GameScore">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./assets/css/home.main.css">
</head>

<body>
    <header class="header">
        <a href="./home.html" class="logo">GameScore</a>

        <form class="search-bar" role="search">
            <input type="search" class="search-input" placeholder="Search games..." aria-label="Rechercher un jeu">
            <button class="search-btn" aria-label="Lancer la recherche">GO</button>
        </form>
        <nav class="auth-nav" aria-label="Navigation utilisateur">
            <a href="./home.html" class="link signup">Home</a>
            <a href="./connect.html" class="btn login">Login</a>
        </nav>
    </header>

    <main>
        <section class="contactPage">
            <div class="contactInfo">
                <div class="pageIntro">
                    <p class="sectionTitle">Contact</p>
                    <h1 class="pageTitle">Talk with GameScore.</h1>
                    <p class="pageText">Questions, bugs, game suggestions or partnership ideas can land here.</p>
                </div>

                <div class="contactList">
                    <div class="contactItem">
                        <strong>Email</strong>
                        <a href="mailto:contact@gamescore.local">contact@gamescore.local</a>
                    </div>
                    <div class="contactItem">
                        <strong>Support</strong>
                        <span>Monday to Friday, 09:00 - 18:00</span>
                    </div>
                    <div class="contactItem">
                        <strong>Project</strong>
                        <span>Game reviews, ratings and community profiles.</span>
                    </div>
                </div>
            </div>

            <form class="contactForm" data-contact-form>
                <h2>Send a message</h2>
                <div class="authForm">
                    <div class="fieldGroup">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="contact-name" placeholder="Your name" required>
                    </div>
                    <div class="fieldGroup">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="contact-email" placeholder="you@example.com" required>
                    </div>
                    <div class="fieldGroup">
                        <label for="contact-subject">Subject</label>
                        <input type="text" id="contact-subject" name="contact-subject" placeholder="What is it about?">
                    </div>
                    <div class="fieldGroup">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="contact-message" placeholder="Write your message"></textarea>
                    </div>
                    <button type="submit" class="neonBtn pinkBtn">Send</button>
                    <p class="formMessage" data-contact-message aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <h2 class="titleFooter">GameScore</h2>
        <div class="aboutFooter">
            <a href="./home.html" class="about">About</a>
            <a href="./contact.html" class="contact">Contact</a>
        </div>
    </footer>

    <script src="./assets/js/app-ui.js"></script>
</body>

</html>

<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>GameScore - game</title>
    <meta name="description" content="Page detail d'un jeu sur GameScore">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./assets/css/home.main.css">
</head>

<body>
    <header class="header">
        <a href="./home.html" class="logo">GameScore</a>

        <form class="search-bar" role="search">
            <input type="search" class="search-input" placeholder="Search games..." aria-label="Rechercher un jeu">
            <button class="search-btn" aria-label="Lancer la recherche">GO</button>
        </form>
        <nav class="auth-nav" aria-label="Navigation utilisateur">
            <a href="./connect.html" class="link signup">Sign Up</a>
            <a href="./user.html" class="btn login">Profil</a>
        </nav>
    </header>

    <main>
        <section class="gameHero">
            <img src="./assets/img/Image-not-found.png" alt="The Last Of Us Part 1" class="gameCover">
            <div class="gameInfo">
                <div class="pageIntro">
                    <h1 class="pageTitle sk"></h1>
                    <p class="pageText sk"></p>
                </div>
                <div class="gameMeta">
                    <span class="metaTag">Action</span>
                    <span class="metaTag">Adventure</span>
                    <span class="metaTag">Naughty Dog</span>
                    <span class="metaTag">2022</span>
                </div>
                <div class="gameActions">
                    <a href="#review-form" class="neonBtn">Write Review</a>
                    <button type="button" class="neonBtn favoriteBtn" id="favoriteBtn">♥ Favorite</button>
                </div>
            </div>
            <div class="scoreBox">
                <div class="scoreItem">
                    <span class="scoreLabel">RAWG</span>
                    <p class="gameScore sk" id="rawgScore"></p>
                </div>
                <div class="scoreItem">
                    <span class="scoreLabel">Community</span>
                    <p class="gameScore sk" id="communityScore"></p>
                </div>
            </div>
        </section>

        <section class="gameContent">
            <div class="contentPanel">
                <h2>Community Reviews</h2>
                <div class="reviewList">
                    <article class="reviewItem">
                        <div>
                            <h3 class="sk">&nbsp;</h3>
                            <p class="sk">&nbsp;</p>
                        </div>
                        <p class="smallScore sk">&nbsp;</p>
                    </article>
                    <article class="reviewItem">
                        <div>
                            <h3 class="sk">&nbsp;</h3>
                            <p class="sk">&nbsp;</p>
                        </div>
                        <p class="smallScore sk">&nbsp;</p>
                    </article>
                    <article class="reviewItem">
                        <div>
                            <h3 class="sk">&nbsp;</h3>
                            <p class="sk">&nbsp;</p>
                        </div>
                        <p class="smallScore sk">&nbsp;</p>
                    </article>
                </div>
            </div>

            <form class="reviewForm" id="review-form">
                <h2>Your Review</h2>
                <div class="authForm">
                    <div class="fieldGroup">
                        <label for="review-title">Title</label>
                        <input type="text" id="review-title" name="review-title" placeholder="Short review title">
                    </div>
                    <div class="fieldGroup">
                        <label for="review-score">Score</label>
                        <input type="number" id="review-score" name="review-score" min="0" max="100" placeholder="0 - 100">
                    </div>
                    <div class="fieldGroup">
                        <label for="review-text">Review</label>
                        <textarea id="review-text" name="review-text" placeholder="What did you think?"></textarea>
                    </div>
                    <button type="submit" class="neonBtn pinkBtn">Publish</button>
                </div>
            </form>
        </section>
    </main>

    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/app-ui.js"></script>
    <script src="./assets/js/score-color.js"></script>
</body>

</html>
